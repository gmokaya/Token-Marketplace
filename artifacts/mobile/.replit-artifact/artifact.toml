kind = "mobile"
previewPath = "/mobile/"
title = "TokenHarvest Mobile"
description = "A native mobile companion app for the TokenHarvest commodity marketplace. Lets traders browse spot listings, monitor live auctions, check their portfolio of electronic warehouse receipts (EWRs), and manage their account — all from their phone. Connects to the shared TokenHarvest API server with Clerk authentication."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
