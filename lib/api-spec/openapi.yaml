openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WRS Digital Agricultural Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: cooperatives
    description: Cooperative & Factory Module
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: health
    description: Health operations
  - name: users
    description: User profile and tier management
  - name: ewrs
    description: Electronic Warehouse Receipts
  - name: listings
    description: Spot market listings
  - name: orders
    description: Spot market orders
  - name: stats
    description: Market statistics and analytics
  - name: market-data
    description: Public official market close data
  - name: auctions
    description: Live digital auctions
  - name: forwards
    description: Forward contract engine
  - name: financing
    description: Pre-sale inventory receipt discounting (IRD)
  - name: settlement
    description: Multi-party escrow settlement split
  - name: admin
    description: Platform administration and earnings
  - name: audit
    description: Compliance audit trail
  - name: tea
    description: Tea lot catalogue and dispatch documents
  - name: coffee
    description: Coffee lot catalogue, auctions, RFQs, shipments and ESG reports
  - name: broker-mandates
    description: Broker mandate grants and revocations
  - name: integrations
    description: Self-service integration credentials for warehouses and producer portals

paths:
  /market-data/daily-closes:
    get:
      operationId: getDailyMarketCloses
      tags: [market-data]
      summary: Get official end-of-day commodity market closes
      description: Returns immutable volume-weighted closing prices from settled marketplace transactions. Prices are normalized to USD per metric ton.
      responses:
        "200":
          description: Latest official close for each commodity, with stale carry-forward metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyMarketCloseFeed"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /ewrs:
    get:
      operationId: listEwrs
      tags: [ewrs]
      summary: List electronic warehouse receipts
      parameters:
        - name: ownerId
          in: query
          schema:
            type: integer
        - name: state
          in: query
          schema:
            type: string
            enum: [INGESTED, MARKET_LISTED, AUCTION_ACTIVE, FORWARD_BOUND, LOCK_TRADING, SETTLED, ENCUMBERED, EXTINGUISHED]
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
      responses:
        "200":
          description: List of eWRs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ewr"
    post:
      operationId: createEwr
      tags: [ewrs]
      summary: Submit eWR intake with commodity-specific grading validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEwrRequest"
      responses:
        "201":
          description: eWR created (INGESTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ewr"
        "400":
          description: Validation error
        "403":
          description: Only Producers and Enablers may submit intake
        "422":
          description: Grading standards not met — intake rejected

  /ewrs/{ewrId}:
    get:
      operationId: getEwr
      tags: [ewrs]
      summary: Get electronic warehouse receipt by ID
      parameters:
        - name: ewrId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: eWR detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ewr"
        "404":
          description: Not found

  /ewrs/my-portfolio:
    get:
      operationId: getMyPortfolio
      tags: [ewrs]
      summary: Get current user's eWR portfolio
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /listings:
    get:
      operationId: listSpotListings
      tags: [listings]
      summary: List spot market listings
      parameters:
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        - name: grade
          in: query
          schema:
            type: string
        - name: warehouseCode
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, LOCKED, SETTLED, CANCELLED]
      responses:
        "200":
          description: List of spot listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpotListing"
    post:
      operationId: createSpotListing
      tags: [listings]
      summary: Create a new spot listing (Producer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotListingInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotListing"
        "400":
          description: Bad request
        "403":
          description: Forbidden

  /listings/{listingId}:
    get:
      operationId: getSpotListing
      tags: [listings]
      summary: Get spot listing by ID
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing detail with eWR metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotListingDetail"
        "404":
          description: Not found
    delete:
      operationId: cancelSpotListing
      tags: [listings]
      summary: Cancel a spot listing (seller only)
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotListing"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for current user
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_SETTLEMENT, SETTLED, EXPIRED, CANCELLED]
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: executeOrder
      tags: [orders]
      summary: Execute a buy order against a spot listing (Off-Taker only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created and eWR locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Bad request or listing not available
        "403":
          description: Forbidden

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status (confirm settlement or cancel)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /stats/market-summary:
    get:
      operationId: getMarketSummary
      tags: [stats]
      summary: Get market-wide summary stats
      responses:
        "200":
          description: Market summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSummary"

  /stats/commodity-breakdown:
    get:
      operationId: getCommodityBreakdown
      tags: [stats]
      summary: Get listing counts and volumes by commodity
      responses:
        "200":
          description: Commodity breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommodityStat"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent trade activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /stats/warehouse-distribution:
    get:
      operationId: getWarehouseDistribution
      tags: [stats]
      summary: Get eWR count and volume by warehouse
      responses:
        "200":
          description: Warehouse distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WarehouseStat"

  /stats/price-trends:
    get:
      operationId: getPriceTrends
      tags: [stats]
      summary: Commodity price trends from auction clearing prices
      parameters:
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
      responses:
        "200":
          description: Price trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceTrendItem"

  /stats/top-bidders:
    get:
      operationId: getTopBidders
      tags: [stats]
      summary: Top bidders leaderboard
      parameters:
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top bidders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopBidder"

  /auctions:
    get:
      operationId: listAuctions
      tags: [auctions]
      summary: List auctions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, CLOSED, SETTLED, CANCELLED]
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        - name: sellerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of auctions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Auction"
    post:
      operationId: createAuction
      tags: [auctions]
      summary: Create an auction (Producer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionInput"
      responses:
        "201":
          description: Created auction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"
        "400":
          description: Bad request
        "403":
          description: Forbidden

  /auctions/{auctionId}:
    get:
      operationId: getAuction
      tags: [auctions]
      summary: Get auction detail with current high bid and countdown
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Auction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionDetail"
        "404":
          description: Not found

  /auctions/{auctionId}/bids:
    get:
      operationId: listAuctionBids
      tags: [auctions]
      summary: Get bid history for an auction
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bid history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuctionBid"
    post:
      operationId: placeBid
      tags: [auctions]
      summary: Place a bid (Off-Taker only)
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidInput"
      responses:
        "201":
          description: Bid placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionBid"
        "400":
          description: Bid too low or auction not open
        "403":
          description: Forbidden

  /forwards:
    get:
      operationId: listForwardContracts
      tags: [forwards]
      summary: List forward contracts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_SIGNATURE, ACTIVE, MATURED, DEFAULTED, CANCELLED]
        - name: sellerId
          in: query
          schema:
            type: integer
        - name: buyerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of forward contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForwardContract"
    post:
      operationId: createForwardContract
      tags: [forwards]
      summary: Create a forward contract (Producer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardContractInput"
      responses:
        "201":
          description: Created forward contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardContract"
        "400":
          description: Bad request
        "403":
          description: Forbidden

  /forwards/{contractId}:
    get:
      operationId: getForwardContract
      tags: [forwards]
      summary: Get forward contract detail with bond status
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Forward contract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardContract"
        "404":
          description: Not found

  /forwards/{contractId}/co-sign:
    post:
      operationId: coSignForwardContract
      tags: [forwards]
      summary: Co-sign a forward contract (Off-Taker only)
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract now bilaterally active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardContract"
        "400":
          description: Already signed or not in PENDING_SIGNATURE state
        "403":
          description: Forbidden

  /forwards/{contractId}/resolve-default:
    post:
      operationId: resolveDefault
      tags: [forwards]
      summary: Trigger default resolution at maturity (buyer or seller breach)
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultSide:
                  type: string
                  enum: [BUYER, SELLER]
                  default: BUYER
      responses:
        "200":
          description: Default resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardContract"
        "400":
          description: Contract not in ACTIVE state or not yet mature
        "403":
          description: Not authorized to trigger this default
        "404":
          description: Not found

  /forwards/{contractId}/complete:
    post:
      operationId: completeForwardContract
      tags: [forwards]
      summary: Mark a forward contract as successfully completed at maturity
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract matured — both bonds released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardContract"
        "400":
          description: Contract not in ACTIVE state or not yet mature
        "403":
          description: Not authorized
        "404":
          description: Not found

  /financing:
    get:
      operationId: listFinancingRequests
      tags: [financing]
      summary: List financing requests (filter by status or requester)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, DISBURSED, REPAID]
        - name: requesterId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of financing requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancingRequest"
    post:
      operationId: requestFinancing
      tags: [financing]
      summary: Request a cash advance against an eWR (Producer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancingRequestInput"
      responses:
        "201":
          description: Financing request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancingRequest"
        "400":
          description: eWR not eligible
        "403":
          description: Forbidden

  /financing/eligible-ewrs:
    get:
      operationId: listEligibleEwrs
      tags: [financing]
      summary: List unencumbered eWRs eligible for discounting with L_max calculated
      responses:
        "200":
          description: Eligible eWRs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EligibleEwr"

  /financing/loan-book:
    get:
      operationId: getLoanBook
      tags: [financing]
      summary: Active loan book for Financier tier — lien-encumbered receipts
      responses:
        "200":
          description: Loan book entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"

  /financing/{requestId}:
    get:
      operationId: getFinancingRequest
      tags: [financing]
      summary: Get financing request detail
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Financing request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancingRequest"
        "404":
          description: Not found

  /financing/{requestId}/approve:
    patch:
      operationId: approveFinancing
      tags: [financing]
      summary: Approve a financing request (Financier only)
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Financing approved — eWR encumbered and loan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancingRequest"
        "400":
          description: Not in PENDING state
        "403":
          description: Financier role required
        "404":
          description: Not found

  /financing/{requestId}/reject:
    patch:
      operationId: rejectFinancing
      tags: [financing]
      summary: Reject a financing request (Financier only)
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Financing rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancingRequest"
        "400":
          description: Not in PENDING state
        "403":
          description: Financier role required
        "404":
          description: Not found

  /financing/{requestId}/disburse:
    patch:
      operationId: disburseFinancing
      tags: [financing]
      summary: Disburse loan capital to farmer wallet (Financier only — APPROVED → DISBURSED)
      description: |
        Blueprint §5.1 Step 2 — Bank Capital Ingress. Simulates the partner bank API
        transferring L_max directly to the farmer's mobile money / bank wallet and
        records a WRSC-CR registry confirmation of the capital ingress event.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Loan capital disbursed to farmer — request status set to DISBURSED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancingRequest"
        "400":
          description: Request is not in APPROVED state
        "403":
          description: Financier role required
        "404":
          description: Not found

  /settlements:
    post:
      operationId: initiateSettlement
      tags: [settlement]
      summary: Initiate a multi-party settlement split for an order, auction, or forward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementInput"
