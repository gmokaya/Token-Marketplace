                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: attachCoffeeDispatchDoc
      tags: [coffee]
      summary: Attach a dispatch document to a coffee lot
      parameters:
        - name: lotId
          in: path
          required: true
