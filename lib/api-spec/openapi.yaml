              required: [lotIds]
              properties:
                lotIds:
                  type: array
                  items:
                    type: integer
                  minItems: 1
      responses:
        "200":
          description: Lots added to session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoffeeAuctionSession"
        "400":
          description: Session not SCHEDULED, lots ineligible, or non-COFFEE lots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the mandate broker or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coffee/auctions/{sessionId}/start:
    post:
      operationId: startCoffeeAuctionSession
      tags: [coffee]
      summary: Start the coffee session — moves the first lot to LIVE
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                durationMins:
                  type: integer
                  default: 7
                  description: Minutes each lot runs before closing
      responses:
        "200":
          description: Session started; first lot is LIVE
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId:
                    type: integer
                  currentLotId:
                    type: integer
                  auctionEndAt:
                    type: string
                    format: date-time
        "400":
          description: Session not SCHEDULED or no lots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coffee/lots/{lotId}/bids:
    post:
      operationId: placeCoffeeLotBid
      tags: [coffee]
      summary: Place a bid on a LIVE coffee lot (OFF_TAKER only). Enforces tiered tick sizes and anti-snipe extension.
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoffeeLotBidInput"
      responses:
        "201":
          description: Bid placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoffeeLotBidResult"
        "400":
          description: Lot not LIVE or bid below minimum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an OFF_TAKER or owner bidding on own lot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coffee/lots/{lotId}/take-out:
    post:
      operationId: coffeeLotTakeOut
      tags: [coffee]
      summary: Broker withdraws a RESERVE_NOT_MET coffee lot
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lot withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoffeeLot"
        "400":
          description: Lot not in RESERVE_NOT_MET status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the mandate broker or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coffee/lots/{lotId}/accept-below-reserve:
    post:
      operationId: acceptCoffeeLotBelowReserve
      tags: [coffee]
      summary: Broker accepts the highest bid even though it is below reserve
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accepted; lot moves to SOLD
          content:
            application/json:
              schema:
                type: object
                properties:
                  lotId:
                    type: integer
                  status:
                    type: string
                  acceptedBelowReserve:
                    type: boolean
                  grossAmountUsd:
                    type: number
                  promptDate:
                    type: string
                    format: date
        "400":
          description: Lot not in RESERVE_NOT_MET status or no bids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the mandate broker or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coffee/lots/{lotId}/settle:
    post:
      operationId: settleCoffeeLot
      tags: [coffee]
      summary: Admin confirms payment received — marks delivery order issuable
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settlement confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoffeeLotSettlement"
        "400":
          description: Payment already confirmed or no settlement record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coffee/lots/{lotId}/settlement:
    get:
      operationId: getCoffeeLotSettlement
      tags: [coffee]
      summary: Get settlement detail for a coffee lot
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settlement record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoffeeLotSettlement"
        "404":
          description: Lot or settlement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ── Coffee Lots ────────────────────────────────────────────────────────────

  /coffee/lots:
    get:
      operationId: listCoffeeLots
      tags: [coffee]
      summary: List coffee lots (filterable by grade, origin, certification, listing type, status)
      parameters:
        - name: grade
          in: query
          schema:
            type: string
        - name: giOrigin
          in: query
          schema:
            type: string
        - name: certification
          in: query
          schema:
            type: string
        - name: listingType
          in: query
          schema:
            type: string
            enum: [AUCTION, FIXED_PRICE]
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, CATALOGUED, DISPATCHED, LIVE, SOLD, UNSOLD, WITHDRAWN, RESERVE_NOT_MET]
        - name: brokerId
          in: query
          schema:
            type: integer
        - name: ownerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of coffee lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoffeeLot"
    post:
      operationId: createCoffeeLot
      tags: [coffee]
      summary: Broker or producer creates a coffee lot catalogue entry (active COFFEE mandate required for brokers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCoffeeLotRequest"
      responses:
        "201":
          description: Coffee lot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoffeeLot"
        "400":
          description: Validation error, AUCTION lot missing reserve price, or eWR is not COFFEE commodity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: No active COFFEE mandate or not an ENABLER/PRODUCER account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: eWR not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coffee/lots/{lotId}:
    get:
      operationId: getCoffeeLot
      tags: [coffee]
      summary: Get full coffee lot detail including coffee-specific eWR fields (coffeeBeanSize, coffeeCuppingScore)
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coffee lot detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoffeeLotDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateCoffeeLot
      tags: [coffee]
      summary: Broker or owner updates a DRAFT/CATALOGUED coffee lot
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCoffeeLotRequest"
      responses:
        "200":
          description: Updated coffee lot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoffeeLot"
        "400":
          description: Lot not in updatable status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the mandate broker or owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coffee/lots/{lotId}/dispatch:
    get:
      operationId: getCoffeeLotDispatchDocs
      tags: [coffee]
      summary: Retrieve dispatch documents for a coffee lot
      parameters:
        - name: lotId
