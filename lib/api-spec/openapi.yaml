        interestRate:
          type: number
        startDate:
          type: string
          format: date-time
        outstandingBalanceUsd:
          type: number
        lienStatus:
          type: string
          enum: [ACTIVE, REPAID, DEFAULTED]
        repaidAt:
          type: ["string", "null"]
          format: date-time
        ewrId:
          type: ["integer", "null"]
        requesterId:
          type: ["integer", "null"]
        requesterName:
          type: ["string", "null"]
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        daysElapsed:
          type: ["integer", "null"]
        accruedInterestUsd:
          type: ["number", "null"]
        totalRepayableUsd:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    Settlement:
      type: object
      required: [id, entityType, entityId, vTotalUsd, rBankUsd, fPlatformUsd, pProducerUsd, bankLegStatus, platformLegStatus, producerLegStatus, createdAt]
      properties:
        id:
          type: integer
        entityType:
          type: string
          enum: [ORDER, AUCTION, FORWARD]
