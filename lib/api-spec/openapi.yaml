        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        estimatedValueUsd:
          type: ["number", "null"]
        approvedAt:
          type: ["string", "null"]
          format: date-time
        disbursedAt:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    FinancingRequestInput:
      type: object
      required: [ewrId]
