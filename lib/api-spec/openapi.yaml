  /broker-mandates/request:
    post:
      operationId: createMandateRequest
      tags: [broker-mandates]
      summary: Broker generates a shareable mandate-request token (ENABLER only)
      description: |
        The broker calls this endpoint to generate an opaque token they can share with a producer
        out-of-band (email, phone, etc.). The producer then calls POST /broker-mandates/confirm
        with that token and their API key to grant the mandate — no producer UI required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMandateRequestBody"
      responses:
        "201":
          description: Mandate request created — includes the token to share with the producer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an ENABLER-tier broker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /broker-mandates/requests:
    get:
      operationId: listMandateRequests
      tags: [broker-mandates]
      summary: Broker lists their mandate requests (newest first)
      responses:
        "200":
          description: List of mandate requests created by this broker
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MandateRequest"

  /broker-mandates/requests/{requestId}:
    delete:
      operationId: cancelMandateRequest
      tags: [broker-mandates]
      summary: Broker cancels a pending mandate request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateRequest"
        "400":
          description: Request is not in PENDING status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the broker who created this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /broker-mandates/confirm:
    post:
      operationId: confirmMandateRequest
      tags: [broker-mandates]
      summary: Producer confirms a mandate request using the broker's token (Clerk or API key)
      description: |
        The producer (PRODUCER or COOPERATIVE tier) confirms the mandate request the broker shared.
        Accepts either a Clerk session (cookie) or an API key in the X-Api-Key header.
        On success, a new broker mandate is created and the request is marked CONFIRMED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmMandateRequestBody"
      responses:
        "201":
          description: Mandate created — the request is now CONFIRMED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerMandate"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not a PRODUCER or COOPERATIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Already confirmed, cancelled, or an active mandate already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Token has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /broker-mandates:
    post:
      operationId: createBrokerMandate
      tags: [broker-mandates]
      summary: Owner grants a broker mandate directly (PRODUCER or COOPERATIVE only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrokerMandateRequest"
      responses:
        "201":
          description: Mandate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerMandate"
        "400":
          description: Target user is not an ENABLER, or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not a PRODUCER or COOPERATIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Active mandate already exists for this broker and commodity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /broker-mandates/my:
    get:
      operationId: getMyMandates
      tags: [broker-mandates]
      summary: Broker retrieves mandates granted to them
      responses:
        "200":
          description: List of mandates received by this broker
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrokerMandate"

  /broker-mandates/given:
    get:
      operationId: getMandatesGiven
      tags: [broker-mandates]
      summary: Owner retrieves mandates they have granted
      responses:
        "200":
          description: List of mandates granted by this owner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrokerMandate"

  /broker-mandates/{mandateId}:
    delete:
      operationId: revokeBrokerMandate
      tags: [broker-mandates]
      summary: Owner revokes a mandate
      parameters:
        - name: mandateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mandate revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerMandate"
        "400":
          description: Already revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the mandate owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Mandate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /warehouse-profiles/{warehouseCode}:
    get:
      operationId: getWarehouseProfileByCode
      tags: [warehouse-profiles]
      summary: Get registered warehouse profile by WRSC code
      parameters:
        - name: warehouseCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Warehouse profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseProfile"
        "404":
          description: Warehouse profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ── Integration Credentials ──────────────────────────────────────────────────
  /integrations/credentials:
    get:
      operationId: listIntegrationCredentials
      tags: [integrations]
      summary: List the caller's integration API keys (no plaintext keys)
      responses:
        "200":
          description: List of integration credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationCredential"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createIntegrationCredential
      tags: [integrations]
      summary: Generate a new integration API key (returned once in plain)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntegrationCredentialRequest"
      responses:
        "201":
          description: Credential created — plaintext key in response body, never again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIntegrationCredentialResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Tier not permitted to manage credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /integrations/credentials/{id}:
    delete:
      operationId: revokeIntegrationCredential
      tags: [integrations]
      summary: Revoke (disable) an integration credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Credential revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
        "404":
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateIntegrationCredential
      tags: [integrations]
      summary: Enable or disable a credential
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated credential state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationCredential"
        "404":
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        pubsub:
          type: object
          properties:
            status:
              type: string
              enum: [initializing, connected, reconnecting]
            reconnectingForMs:
              type: integer
              description: Milliseconds the subscriber has been in reconnecting state (only present when status is reconnecting)
          required:
            - status
      required:
        - status
        - pubsub

    User:
      type: object
      required: [id, clerkId, name, email, tier, reputationScore, kybStatus, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        name:
          type: string
        email:
          type: string
        tier:
          type: string
          enum: [PRODUCER, OFF_TAKER, ENABLER, FINANCIER, COOPERATIVE, ADMIN]
        reputationScore:
          type: integer
        kybStatus:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        company:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        company:
          type: string
        tier:
          type: string
          enum: [PRODUCER, OFF_TAKER, ENABLER, FINANCIER, COOPERATIVE, ADMIN]

    CreateEwrRequest:
      type: object
      required: [ewrsReceiptId, wrscSignature, warehouseCode, commodityType, grade, weightMt, harvestSeason]
      properties:
        ewrsReceiptId:
          type: string
        wrscSignature:
          type: string
        warehouseCode:
          type: string
        commodityType:
          type: string
          enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        grade:
          type: string
        weightMt:
          type: number
        harvestSeason:
          type: string
        estimatedValueUsd:
          type: number
        moisturePct:
          type: number
        foreignMatterPct:
          type: number
        brokenGrainsPct:
          type: number
        insectDamagedGrainsPct:
          type: number
        coffeeBeanSize:
          type: string
          enum: [AA, AB, PB, C]
        coffeeCuppingScore:
          type: number
        teaProcessingType:
          type: string
          enum: [CTC, ORTHODOX]
        teaLeafGrade:
          type: string
          enum: [BOP, BOPF, D1, PF]
        teaInvoiceSerial:
          type: string
        avocadoVariety:
          type: string
          enum: [HASS, FUERTE]
        avocadoSizingCode:
          type: integer
        avocadoColdChainCompliant:
          type: boolean

    Ewr:
      type: object
      required: [id, ewrsReceiptId, wrscSignature, warehouseCode, commodityType, batchType, grade, weightMt, harvestSeason, isLienActive, state, ownerId, issuedAt]
      properties:
        id:
          type: integer
        ewrsReceiptId:
          type: string
        wrscSignature:
          type: string
        warehouseCode:
          type: string
        commodityType:
          type: string
          enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        batchType:
          type: string
          enum: [FUNGIBLE, SEMI_FUNGIBLE, NON_FUNGIBLE, TIME_DECAYING]
        grade:
          type: string
        weightMt:
          type: number
        harvestSeason:
          type: string
        isLienActive:
          type: boolean
        lienHolderId:
          type: ["integer", "null"]
        state:
          type: string
          enum: [INGESTED, MARKET_LISTED, AUCTION_ACTIVE, FORWARD_BOUND, LOCK_TRADING, SETTLED, ENCUMBERED, EXTINGUISHED]
        ownerId:
          type: integer
        ownerName:
          type: ["string", "null"]
        expiryAt:
          type: ["string", "null"]
          format: date-time
        issuedAt:
          type: string
          format: date-time
        estimatedValueUsd:
          type: ["number", "null"]
        lienLoanOutstandingUsd:
          type: ["number", "null"]
        moisturePct:
          type: ["number", "null"]
        foreignMatterPct:
          type: ["number", "null"]
        brokenGrainsPct:
          type: ["number", "null"]
        insectDamagedGrainsPct:
          type: ["number", "null"]
        coffeeBeanSize:
          type: ["string", "null"]
          enum: [AA, AB, PB, C, null]
        coffeeCuppingScore:
          type: ["number", "null"]
        teaProcessingType:
          type: ["string", "null"]
          enum: [CTC, ORTHODOX, null]
        teaLeafGrade:
          type: ["string", "null"]
          enum: [BOP, BOPF, D1, PF, null]
        teaInvoiceSerial:
          type: ["string", "null"]
        avocadoVariety:
          type: ["string", "null"]
          enum: [HASS, FUERTE, null]
        avocadoSizingCode:
          type: ["integer", "null"]
        avocadoColdChainCompliant:
          type: ["boolean", "null"]
        avocadoDegradationCoefficient:
          type: ["number", "null"]
        poolGroupId:
          type: ["string", "null"]

    Portfolio:
      type: object
      required: [ewrs, totalValueUsd, byState, byCommodity]
      properties:
        ewrs:
          type: array
          items:
            $ref: "#/components/schemas/Ewr"
        totalValueUsd:
          type: number
        byState:
          type: array
          items:
            type: object
            required: [state, count]
            properties:
              state:
                type: string
              count:
                type: integer
        byCommodity:
          type: array
          items:
            type: object
            required: [commodityType, count, totalWeightMt]
            properties:
              commodityType:
                type: string
              count:
                type: integer
              totalWeightMt:
                type: number

    SpotListing:
      type: object
      required: [id, ewrId, sellerId, pricePerMt, currency, status, createdAt]
      properties:
        id:
          type: integer
        ewrId:
          type: integer
        sellerId:
          type: integer
        sellerName:
          type: ["string", "null"]
        pricePerMt:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [ACTIVE, LOCKED, SETTLED, CANCELLED]
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        moisturePct:
          type: ["number", "null"]
        harvestSeason:
          type: ["string", "null"]
        totalValueUsd:
          type: ["number", "null"]
        platformFeeUsd:
          type: ["number", "null"]
        escrowFeeUsd:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    SpotListingDetail:
      type: object
      required: [listing, ewr]
      properties:
        listing:
          $ref: "#/components/schemas/SpotListing"
        ewr:
          $ref: "#/components/schemas/Ewr"

    SpotListingInput:
      type: object
      required: [ewrId, pricePerMt, currency]
      properties:
        ewrId:
          type: integer
        pricePerMt:
          type: number
        currency:
          type: string
          default: USD

    Order:
      type: object
      required: [id, listingId, buyerId, lockedAt, expiresAt, status, totalUsd, platformFeeUsd, escrowFeeUsd, createdAt]
      properties:
        id:
          type: integer
        listingId:
          type: integer
        buyerId:
          type: integer
        buyerName:
          type: ["string", "null"]
        lockedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        settledAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [PENDING_SETTLEMENT, SETTLED, EXPIRED, CANCELLED]
        totalUsd:
          type: number
        platformFeeUsd:
          type: number
        escrowFeeUsd:
          type: number
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        pricePerMt:
          type: ["number", "null"]
        sellerName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    OrderInput:
      type: object
      required: [listingId]
      properties:
        listingId:
          type: integer

    OrderUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CANCELLED]

    MarketSummary:
      type: object
      required: [totalActiveListings, totalEwrsIngested, totalSettledToday, totalVolumeUsd, totalEwrs]
      properties:
        totalActiveListings:
          type: integer
        totalEwrsIngested:
          type: integer
        totalEwrs:
          type: integer
        totalSettledToday:
          type: integer
        totalVolumeUsd:
          type: number
        avgPricePerMt:
          type: ["number", "null"]

    DailyMarketCloseFeed:
      type: object
      required: [asOfTradingDate, timezone, cutoffTime, calculatedAt, closes]
      properties:
        asOfTradingDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        timezone:
          type: string
          const: Africa/Nairobi
        cutoffTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        calculatedAt:
          type: string
          format: date-time
        closes:
          type: array
          items:
            $ref: "#/components/schemas/DailyMarketClose"

    DailyMarketClose:
      type: object
      required:
        - commodityType
        - displayName
        - closePriceUsdPerMt
        - previousClosePriceUsdPerMt
        - changePct
        - tradedVolumeMt
        - turnoverUsd
        - tradeCount
        - sourceMarkets
        - sourceTimestamp
        - tradingDate
        - isStale
        - isComplete
      properties:
        commodityType:
          type: string
          enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        displayName:
          type: string
        closePriceUsdPerMt:
          type: number
        previousClosePriceUsdPerMt:
          type: ["number", "null"]
        changePct:
          type: ["number", "null"]
        tradedVolumeMt:
          type: number
        turnoverUsd:
          type: number
        tradeCount:
          type: integer
        sourceMarkets:
          type: array
          items:
            type: string
            enum: [GRAIN_SPOT, COFFEE_AUCTION, TEA_AUCTION]
        sourceTimestamp:
          type: string
          format: date-time
        tradingDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        isStale:
          type: boolean
        isComplete:
          type: boolean

    CommodityStat:
      type: object
      required: [commodityType, activeListings, totalEwrs, totalWeightMt, avgPricePerMt]
      properties:
        commodityType:
          type: string
        activeListings:
          type: integer
        totalEwrs:
          type: integer
        totalWeightMt:
          type: number
        avgPricePerMt:
          type: ["number", "null"]

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [LISTING_CREATED, ORDER_EXECUTED, ORDER_SETTLED, EWR_INGESTED, EWR_ENCUMBERED]
        description:
          type: string
        commodityType:
          type: ["string", "null"]
        valueUsd:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    WarehouseStat:
      type: object
      required: [warehouseCode, ewrCount, totalWeightMt]
      properties:
        warehouseCode:
          type: string
        ewrCount:
          type: integer
        totalWeightMt:
          type: number
        activeCommodities:
          type: array
          items:
            type: string

    Auction:
      type: object
      required: [id, ewrId, sellerId, reservePriceUsd, bidIncrementPct, startAt, endAt, status, createdAt]
      properties:
        id:
          type: integer
        ewrId:
          type: integer
        sellerId:
          type: integer
        sellerName:
          type: ["string", "null"]
        reservePriceUsd:
          type: number
        bidIncrementPct:
          type: number
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [OPEN, CLOSED, SETTLED, CANCELLED]
        winningBidId:
          type: ["integer", "null"]
        currentHighBidUsd:
          type: ["number", "null"]
        bidCount:
          type: integer
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        settlementDeadlineAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    AuctionDetail:
      type: object
      required: [auction, bids, secondsRemaining]
      properties:
        auction:
          $ref: "#/components/schemas/Auction"
        bids:
          type: array
          items:
            $ref: "#/components/schemas/AuctionBid"
        secondsRemaining:
          type: number
        ewr:
          $ref: "#/components/schemas/Ewr"

    AuctionBid:
      type: object
      required: [id, auctionId, bidderId, amountUsd, placedAt, isWinning]
      properties:
        id:
          type: integer
        auctionId:
          type: integer
        bidderId:
          type: integer
        bidderName:
          type: ["string", "null"]
        amountUsd:
          type: number
        placedAt:
          type: string
          format: date-time
        isWinning:
          type: boolean

    AuctionInput:
      type: object
      required: [ewrId, reservePriceUsd, durationMinutes]
      properties:
        ewrId:
          type: integer
        reservePriceUsd:
          type: number
        bidIncrementPct:
          type: number
          default: 1.5
        durationMinutes:
          type: integer
          description: Auction duration in minutes from now

    BidInput:
      type: object
      required: [amountUsd]
      properties:
        amountUsd:
          type: number

    ForwardContract:
      type: object
      required: [id, ewrId, sellerId, maturityDate, deliveryPriceUsd, performanceBondUsd, sellerBondStatus, buyerBondStatus, contractStatus, createdAt]
      properties:
        id:
          type: integer
        ewrId:
          type: integer
        sellerId:
          type: integer
        sellerName:
          type: ["string", "null"]
        buyerId:
          type: ["integer", "null"]
        buyerName:
          type: ["string", "null"]
        maturityDate:
          type: string
          format: date-time
        deliveryPriceUsd:
          type: number
        performanceBondUsd:
          type: number
        sellerBondStatus:
          type: string
          enum: [PENDING_BOND, ACTIVE, FORFEITED, RELEASED]
        buyerBondStatus:
          type: string
          enum: [PENDING_BOND, ACTIVE, FORFEITED, RELEASED]
        contractStatus:
          type: string
          enum: [PENDING_SIGNATURE, ACTIVE, MATURED, DEFAULTED, CANCELLED]
        signedAt:
          type: ["string", "null"]
          format: date-time
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ForwardContractInput:
      type: object
      required: [ewrId, maturityDate, deliveryPriceUsd]
      properties:
        ewrId:
          type: integer
        maturityDate:
          type: string
          format: date-time
        deliveryPriceUsd:
          type: number

    PriceTrendItem:
      type: object
      required: [commodityType, clearingPriceUsd, settledAt]
      properties:
        commodityType:
          type: string
        clearingPriceUsd:
          type: number
        settledAt:
          type: string
          format: date-time
        weightMt:
          type: ["number", "null"]

    TopBidder:
      type: object
      required: [bidderId, bidderName, totalBids, highestBidUsd, commodityType]
      properties:
        bidderId:
          type: integer
        bidderName:
          type: ["string", "null"]
        totalBids:
          type: integer
        highestBidUsd:
          type: number
        commodityType:
          type: string

    FinancingRequest:
      type: object
      required: [id, ewrId, requesterId, marketValueUsd, lMaxUsd, interestRate, status, createdAt]
      properties:
        id:
          type: integer
        ewrId:
          type: integer
        requesterId:
          type: integer
        requesterName:
          type: ["string", "null"]
        lenderId:
          type: ["integer", "null"]
        lenderName:
          type: ["string", "null"]
        marketValueUsd:
          type: number
        lMaxUsd:
          type: number
        interestRate:
          type: number
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, DISBURSED, REPAID]
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
