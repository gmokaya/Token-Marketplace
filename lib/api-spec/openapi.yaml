              $ref: "#/components/schemas/AttachDispatchDocRequest"
      responses:
        "201":
          description: Document attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoffeeDispatchDoc"
        "400":
          description: Delivery order only allowed on SOLD lots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the mandate broker or owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ── Coffee RFQs ────────────────────────────────────────────────────────────

  /coffee/rfqs:
