        sellerName:
          type: ["string", "null"]
        buyerId:
          type: ["integer", "null"]
        buyerName:
          type: ["string", "null"]
        maturityDate:
          type: string
          format: date-time
        deliveryPriceUsd:
          type: number
        performanceBondUsd:
          type: number
        sellerBondStatus:
          type: string
