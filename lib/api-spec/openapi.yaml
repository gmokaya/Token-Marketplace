      operationId: createCoffeeRfq
      tags: [coffee]
      summary: Create a coffee RFQ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: RFQ created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /coffee/rfqs/{rfqId}:
    get:
      operationId: getCoffeeRfq
      tags: [coffee]
      summary: Get coffee RFQ detail with messages and quotations
      parameters:
        - name: rfqId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: RFQ detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /coffee/rfqs/{rfqId}/messages:
    post:
      operationId: sendCoffeeRfqMessage
      tags: [coffee]
      summary: Send a message on a coffee RFQ
      parameters:
        - name: rfqId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                senderRole:
                  type: string
                  enum: [factory, buyer]
                attachments:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /coffee/rfqs/{rfqId}/quotations:
    post:
      operationId: submitCoffeeRfqQuotation
      tags: [coffee]
      summary: Submit a quotation on a coffee RFQ
      parameters:
        - name: rfqId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerPriceUsdPerKg, offerQuantityKg]
              properties:
                offerPriceUsdPerKg:
                  type: number
                offerQuantityKg:
                  type: number
                incoterms:
                  type: string
                leadTimeDays:
                  type: integer
                validUntil:
                  type: string
                notes:
                  type: string
                commercialPitch:
                  type: string
                cuppingScore:
                  type: number
                  description: Coffee-specific — cupping score of offered lot
                processingMethod:
                  type: string
                  description: Coffee-specific — Washed / Natural / Honey
                varietal:
                  type: string
                  description: Coffee-specific — Bourbon / Geisha / SL28 etc.
      responses:
        "201":
          description: Quotation submitted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /coffee/rfqs/{rfqId}/status:
    patch:
      operationId: updateCoffeeRfqStatus
      tags: [coffee]
      summary: Update coffee RFQ status
      parameters:
        - name: rfqId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, quoted, negotiating, accepted, rejected, expired, converted]
      responses:
        "200":
          description: Updated RFQ
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

