        signedAt:
          type: ["string", "null"]
          format: date-time
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ForwardContractInput:
      type: object
