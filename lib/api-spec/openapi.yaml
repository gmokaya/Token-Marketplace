openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WRS Digital Agricultural Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and tier management
  - name: ewrs
    description: Electronic Warehouse Receipts
  - name: listings
    description: Spot market listings
  - name: orders
    description: Spot market orders
  - name: stats
    description: Market statistics and analytics
  - name: auctions
    description: Live digital auctions
  - name: forwards
    description: Forward contract engine

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /ewrs:
    get:
      operationId: listEwrs
      tags: [ewrs]
      summary: List electronic warehouse receipts
      parameters:
        - name: ownerId
          in: query
          schema:
            type: integer
        - name: state
          in: query
          schema:
            type: string
            enum: [INGESTED, MARKET_LISTED, LOCK_TRADING, SETTLED, ENCUMBERED]
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
      responses:
        "200":
          description: List of eWRs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ewr"

  /ewrs/{ewrId}:
    get:
      operationId: getEwr
      tags: [ewrs]
      summary: Get electronic warehouse receipt by ID
      parameters:
        - name: ewrId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: eWR detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ewr"
        "404":
          description: Not found

  /ewrs/my-portfolio:
    get:
      operationId: getMyPortfolio
      tags: [ewrs]
      summary: Get current user's eWR portfolio
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /listings:
    get:
      operationId: listSpotListings
      tags: [listings]
      summary: List spot market listings
      parameters:
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        - name: grade
          in: query
          schema:
            type: string
        - name: warehouseCode
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, LOCKED, SETTLED, CANCELLED]
      responses:
        "200":
          description: List of spot listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpotListing"
    post:
      operationId: createSpotListing
      tags: [listings]
      summary: Create a new spot listing (Producer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotListingInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotListing"
        "400":
          description: Bad request
        "403":
          description: Forbidden

  /listings/{listingId}:
    get:
      operationId: getSpotListing
      tags: [listings]
      summary: Get spot listing by ID
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing detail with eWR metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotListingDetail"
        "404":
          description: Not found
    delete:
      operationId: cancelSpotListing
      tags: [listings]
      summary: Cancel a spot listing (seller only)
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotListing"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for current user
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_SETTLEMENT, SETTLED, EXPIRED, CANCELLED]
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: executeOrder
      tags: [orders]
      summary: Execute a buy order against a spot listing (Off-Taker only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created and eWR locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Bad request or listing not available
        "403":
          description: Forbidden

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status (confirm settlement or cancel)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /stats/market-summary:
    get:
      operationId: getMarketSummary
      tags: [stats]
      summary: Get market-wide summary stats
      responses:
        "200":
          description: Market summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSummary"

  /stats/commodity-breakdown:
    get:
      operationId: getCommodityBreakdown
      tags: [stats]
      summary: Get listing counts and volumes by commodity
      responses:
        "200":
          description: Commodity breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommodityStat"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent trade activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /stats/warehouse-distribution:
    get:
      operationId: getWarehouseDistribution
      tags: [stats]
      summary: Get eWR count and volume by warehouse
      responses:
        "200":
          description: Warehouse distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WarehouseStat"

  /stats/price-trends:
    get:
      operationId: getPriceTrends
      tags: [stats]
      summary: Commodity price trends from auction clearing prices
      parameters:
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
      responses:
        "200":
          description: Price trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceTrendItem"

  /stats/top-bidders:
    get:
      operationId: getTopBidders
      tags: [stats]
      summary: Top bidders leaderboard
      parameters:
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top bidders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopBidder"

  /auctions:
    get:
      operationId: listAuctions
      tags: [auctions]
      summary: List auctions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, CLOSED, SETTLED, CANCELLED]
        - name: commodityType
          in: query
          schema:
            type: string
            enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        - name: sellerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of auctions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Auction"
    post:
      operationId: createAuction
      tags: [auctions]
      summary: Create an auction (Producer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionInput"
      responses:
        "201":
          description: Created auction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"
        "400":
          description: Bad request
        "403":
          description: Forbidden

  /auctions/{auctionId}:
    get:
      operationId: getAuction
      tags: [auctions]
      summary: Get auction detail with current high bid and countdown
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Auction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionDetail"
        "404":
          description: Not found

  /auctions/{auctionId}/bids:
    get:
      operationId: listAuctionBids
      tags: [auctions]
      summary: Get bid history for an auction
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bid history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuctionBid"
    post:
      operationId: placeBid
      tags: [auctions]
      summary: Place a bid (Off-Taker only)
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidInput"
      responses:
        "201":
          description: Bid placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionBid"
        "400":
          description: Bid too low or auction not open
        "403":
          description: Forbidden

  /forwards:
    get:
      operationId: listForwardContracts
      tags: [forwards]
      summary: List forward contracts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_SIGNATURE, ACTIVE, MATURED, DEFAULTED, CANCELLED]
        - name: sellerId
          in: query
          schema:
            type: integer
        - name: buyerId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of forward contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForwardContract"
    post:
      operationId: createForwardContract
      tags: [forwards]
      summary: Create a forward contract (Producer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardContractInput"
      responses:
        "201":
          description: Created forward contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardContract"
        "400":
          description: Bad request
        "403":
          description: Forbidden

  /forwards/{contractId}:
    get:
      operationId: getForwardContract
      tags: [forwards]
      summary: Get forward contract detail with bond status
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Forward contract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardContract"
        "404":
          description: Not found

  /forwards/{contractId}/co-sign:
    post:
      operationId: coSignForwardContract
      tags: [forwards]
      summary: Co-sign a forward contract (Off-Taker only)
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract now bilaterally active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardContract"
        "400":
          description: Already signed or not in PENDING_SIGNATURE state
        "403":
          description: Forbidden

  /forwards/{contractId}/resolve-default:
    post:
      operationId: resolveDefault
      tags: [forwards]
      summary: Trigger default resolution at maturity
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Default resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardContract"
        "400":
          description: Contract not in ACTIVE state or not yet mature
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, clerkId, name, email, tier, reputationScore, kybStatus, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        name:
          type: string
        email:
          type: string
        tier:
          type: string
          enum: [PRODUCER, OFF_TAKER, ENABLER, FINANCIER]
        reputationScore:
          type: integer
        kybStatus:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        company:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        company:
          type: string
        tier:
          type: string
          enum: [PRODUCER, OFF_TAKER, ENABLER, FINANCIER]

    Ewr:
      type: object
      required: [id, ewrsReceiptId, wrscSignature, warehouseCode, commodityType, grade, weightMt, moisturePct, harvestSeason, isLienActive, state, ownerId, issuedAt]
      properties:
        id:
          type: integer
        ewrsReceiptId:
          type: string
        wrscSignature:
          type: string
        warehouseCode:
          type: string
        commodityType:
          type: string
          enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        grade:
          type: string
        weightMt:
          type: number
        moisturePct:
          type: ["number", "null"]
        harvestSeason:
          type: string
        isLienActive:
          type: boolean
        lienHolderId:
          type: ["integer", "null"]
        state:
          type: string
          enum: [INGESTED, MARKET_LISTED, LOCK_TRADING, SETTLED, ENCUMBERED]
        ownerId:
          type: integer
        ownerName:
          type: ["string", "null"]
        expiryAt:
          type: ["string", "null"]
          format: date-time
        issuedAt:
          type: string
          format: date-time
        estimatedValueUsd:
          type: ["number", "null"]

    Portfolio:
      type: object
      required: [ewrs, totalValueUsd, byState, byCommodity]
      properties:
        ewrs:
          type: array
          items:
            $ref: "#/components/schemas/Ewr"
        totalValueUsd:
          type: number
        byState:
          type: array
          items:
            type: object
            required: [state, count]
            properties:
              state:
                type: string
              count:
                type: integer
        byCommodity:
          type: array
          items:
            type: object
            required: [commodityType, count, totalWeightMt]
            properties:
              commodityType:
                type: string
              count:
                type: integer
              totalWeightMt:
                type: number

    SpotListing:
      type: object
      required: [id, ewrId, sellerId, pricePerMt, currency, status, createdAt]
      properties:
        id:
          type: integer
        ewrId:
          type: integer
        sellerId:
          type: integer
        sellerName:
          type: ["string", "null"]
        pricePerMt:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [ACTIVE, LOCKED, SETTLED, CANCELLED]
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        moisturePct:
          type: ["number", "null"]
        harvestSeason:
          type: ["string", "null"]
        totalValueUsd:
          type: ["number", "null"]
        platformFeeUsd:
          type: ["number", "null"]
        escrowFeeUsd:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    SpotListingDetail:
      type: object
      required: [listing, ewr]
      properties:
        listing:
          $ref: "#/components/schemas/SpotListing"
        ewr:
          $ref: "#/components/schemas/Ewr"

    SpotListingInput:
      type: object
      required: [ewrId, pricePerMt, currency]
      properties:
        ewrId:
          type: integer
        pricePerMt:
          type: number
        currency:
          type: string
          default: USD

    Order:
      type: object
      required: [id, listingId, buyerId, lockedAt, expiresAt, status, totalUsd, platformFeeUsd, escrowFeeUsd, createdAt]
      properties:
        id:
          type: integer
        listingId:
          type: integer
        buyerId:
          type: integer
        buyerName:
          type: ["string", "null"]
        lockedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        settledAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [PENDING_SETTLEMENT, SETTLED, EXPIRED, CANCELLED]
        totalUsd:
          type: number
        platformFeeUsd:
          type: number
        escrowFeeUsd:
          type: number
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        pricePerMt:
          type: ["number", "null"]
        sellerName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    OrderInput:
      type: object
      required: [listingId]
      properties:
        listingId:
          type: integer

    OrderUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [SETTLED, CANCELLED]

    MarketSummary:
      type: object
      required: [totalActiveListings, totalEwrsIngested, totalSettledToday, totalVolumeUsd, totalEwrs]
      properties:
        totalActiveListings:
          type: integer
        totalEwrsIngested:
          type: integer
        totalEwrs:
          type: integer
        totalSettledToday:
          type: integer
        totalVolumeUsd:
          type: number
        avgPricePerMt:
          type: ["number", "null"]

    CommodityStat:
      type: object
      required: [commodityType, activeListings, totalEwrs, totalWeightMt, avgPricePerMt]
      properties:
        commodityType:
          type: string
        activeListings:
          type: integer
        totalEwrs:
          type: integer
        totalWeightMt:
          type: number
        avgPricePerMt:
          type: ["number", "null"]

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [LISTING_CREATED, ORDER_EXECUTED, ORDER_SETTLED, EWR_INGESTED, EWR_ENCUMBERED]
        description:
          type: string
        commodityType:
          type: ["string", "null"]
        valueUsd:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    WarehouseStat:
      type: object
      required: [warehouseCode, ewrCount, totalWeightMt]
      properties:
        warehouseCode:
          type: string
        ewrCount:
          type: integer
        totalWeightMt:
          type: number
        activeCommodities:
          type: array
          items:
            type: string

    Auction:
      type: object
      required: [id, ewrId, sellerId, reservePriceUsd, bidIncrementPct, startAt, endAt, status, createdAt]
      properties:
        id:
          type: integer
        ewrId:
          type: integer
        sellerId:
          type: integer
        sellerName:
          type: ["string", "null"]
        reservePriceUsd:
          type: number
        bidIncrementPct:
          type: number
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [OPEN, CLOSED, SETTLED, CANCELLED]
        winningBidId:
          type: ["integer", "null"]
        currentHighBidUsd:
          type: ["number", "null"]
        bidCount:
          type: integer
        commodityType:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        weightMt:
          type: ["number", "null"]
        warehouseCode:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AuctionDetail:
      type: object
      required: [auction, bids, secondsRemaining]
      properties:
        auction:
          $ref: "#/components/schemas/Auction"
        bids:
          type: array
          items:
            $ref: "#/components/schemas/AuctionBid"
        secondsRemaining:
          type: number
        ewr:
          $ref: "#/components/schemas/Ewr"

    AuctionBid:
      type: object
      required: [id, auctionId, bidderId, amountUsd, placedAt, isWinning]
      properties:
        id:
          type: integer
        auctionId:
