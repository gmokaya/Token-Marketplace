    # ── Broker Mandates ────────────────────────────────────────────────────

    MandateRequest:
      type: object
      required: [id, brokerId, commodityType, token, status, expiresAt, createdAt]
      properties:
        id:
          type: integer
        brokerId:
          type: integer
        brokerName:
          type: ["string", "null"]
        commodityType:
          type: string
          enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        token:
          type: string
          description: Opaque UUID token to share with the producer
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
        confirmedAt:
          type: ["string", "null"]
          format: date-time
        confirmedMandateId:
          type: ["integer", "null"]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        confirmInstructions:
          type: object
          description: Instructions for the producer to confirm the request
          properties:
            endpoint:
              type: string
            authHeader:
              type: string
            body:
              type: object
              additionalProperties: true

    CreateMandateRequestBody:
      type: object
      required: [commodityType]
      properties:
        commodityType:
          type: string
          enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        note:
          type: string
          maxLength: 500
          description: Optional note for context (e.g. producer name or deal reference)
        expiryDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
          description: How many days until this token expires

    ConfirmMandateRequestBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token the broker shared
        permissions:
          type: array
          items:
            type: string
          default: ["list", "accept_bids", "negotiate", "set_reserve"]
        commissionRateOverride:
          type: number
          minimum: 0
          maximum: 1
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time

    BrokerMandate:
      type: object
      required: [id, ownerId, brokerId, commodityType, permissions, validFrom, revoked, createdAt]
      properties:
        id:
          type: integer
        ownerId:
          type: integer
        ownerName:
          type: ["string", "null"]
        brokerId:
          type: integer
        brokerName:
          type: ["string", "null"]
        commodityType:
          type: string
          enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        permissions:
          type: array
          items:
            type: string
        commissionRateOverride:
          type: ["number", "null"]
        validFrom:
          type: string
          format: date-time
        validTo:
          type: ["string", "null"]
          format: date-time
        revoked:
          type: boolean
        revokedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateBrokerMandateRequest:
      type: object
      required: [brokerId, commodityType]
      properties:
        brokerId:
          type: integer
          description: User ID of the ENABLER-tier broker
        commodityType:
          type: string
          enum: [MAIZE, RICE, COFFEE, TEA, AVOCADO]
        permissions:
          type: array
          items:
            type: string
          default: ["list", "accept_bids", "negotiate", "set_reserve"]
        commissionRateOverride:
          type: number
          minimum: 0
          maximum: 1
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time

    # ── Integration Credentials ────────────────────────────────────────────────

    IntegrationCredential:
      type: object
      required: [id, name, keyPrefix, scopes, enabled, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        keyPrefix:
          type: string
          description: First 16 characters of the key, e.g. "sk_live_abcdefgh"
        scopes:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateIntegrationCredentialRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
            enum: [ewr:push, wrsc:intake, mandates:confirm]
          minItems: 1
        expiresAt:
          type: string
          format: date-time

    CreateIntegrationCredentialResponse:
      allOf:
        - $ref: "#/components/schemas/IntegrationCredential"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Plaintext API key — only present in this response, never again
